# Shared configuration. Credentials are supplied by the environment, never committed.
spring.application.name=lms-auth-employee
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lms_auth_employee}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# A small pool limits connections per Lambda execution environment.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.jpa.open-in-view=false
# Default refuses an unmanaged production schema; local profile creates/updates development tables.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
app.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
